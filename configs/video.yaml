%YAML 1.2
---


general:
#  source: "dataset"
#  source: "camera"
  source: "record"
#  source: "stream"

dataset:  # Dataset name from the DATASETS list
  name: "kitti"
  sequence: "02"

  kitti:
    resolution: [ 1271, 376 ]
    fps: 10
  euroc_mav:
    resolution: [ 752, 480 ]
    fps: 20

camera:
  device: 0
  fps: 30

record:
#  path: "/home/apin/Desktop/ComputerVision/Videos"
#  video: "DJI_0530.MP4"
  path: "/home/apin/Desktop/ComputerVision/Visual_Odometry/videos"
  video: "long.mp4"
  fps: 30

stream:
  pipeline: "udpsrc port=5600 auto-multicast=true caps=\"application/x-rtp, media=(string)video, clock-rate=(int)90000, encoding-name=(string)H264\" ! rtph264depay ! avdec_h264 ! videoconvert ! appsink sync=false"
